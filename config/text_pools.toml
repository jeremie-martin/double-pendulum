# Text Pools for Video Captions
#
# Philosophy:
# - Each caption should be self-contained and make sense on its own
# - The visual chaos IS the payoff - captions just set the stage
# - Use {count} for formatted pendulum count (e.g., "1M", "500K")
# - Keep it clean, modern, not cheesy
# - State-description pools (_setup) ONLY contain texts that describe
#   a current state — these pair with subversion followups
# - Imperative/question pools ONLY pair with event-teaser followups
#   or standalone templates

# =============================================================================
# HOOKS - Opening captions (first few seconds)
# Goal: Set context, grab attention, let the visual do the rest
# =============================================================================

[hooks.science]
# Factual statements about the simulation - each works standalone
texts = [
    "Same starting position.",
    "{count} pendulums.",
    "Nearly identical conditions.",
    "Tiny differences in starting angle.",
    "The butterfly effect.",
    "Chaos theory in action.",
    "From order to chaos.",
    "Deterministic yet unpredictable.",
    "0.00001° apart.",
    "Same start, different end.",
    "Divergence is inevitable.",
    "Each one follows the same laws.",
]

[hooks.science_setup]
# Starting conditions that describe sameness/order — use in _then templates
# These pair with mystery_followup ("Not for long.", "This can't last.", etc.)
# RULE: every text here must describe a state that can be subverted
texts = [
    "Same starting position.",
    "Nearly identical conditions.",
    "They all start together.",
    "Perfectly synchronized.",
    "Each one follows the same laws.",
]

[hooks.mystery_setup]
# State descriptions with a mysterious/ominous tone — use in _then templates
# Like science_setup, these describe a state that followups can subvert
texts = [
    "It starts simple.",
    "Looks stable, right?",
    "They started as one.",
]

[hooks.wait]
# Classic anticipation hooks
texts = [
    "Wait for it...",
    "Watch closely.",
]

[hooks.challenge]
# Interactive - asks viewer to engage
texts = [
    "Spot when it happens.",
    "Find the moment.",
    "Watch for the shift.",
]

[hooks.pov]
# POV-style immersive hooks - visual is the punchline
texts = [
    "POV: chaos theory",
    "POV: butterfly effect",
    "POV: deterministic chaos",
]

[hooks.context]
# Context-setting hooks - what you're watching
texts = [
    "This is chaos theory.",
    "Deterministic chaos.",
    "Sensitivity to initial conditions.",
]

[hooks.count]
# Simple count display - just the facts
texts = [
    "{count} pendulums",
    "{count} simulations",
    "{count} identical starts",
]

[hooks.mystery]
# Mysterious openers - work as FIRST caption (standalone)
# NOTE: imperative texts removed — they don't pair with mystery_followup
texts = [
    "Watch what unfolds.",
    "It starts simple.",
    "Looks stable, right?",
    "Order... for now.",
]

[hooks.mystery_followup]
# Followups - ONLY use as SECOND caption after a state-describing setup
# These need a prior state description to make sense
# RULE: only pair with _setup pools or state-describing texts
texts = [
    "Then this happens.",
    "Not for long.",
    "This can't last.",
    "Here it comes.",
    "And then...",
]

# =============================================================================
# ENGAGEMENT - End captions
# Goal: Atmospheric closers, tease next video, or encourage follow
# =============================================================================

[engagement.subscribe]
# Call to action - subscribe/follow
texts = [
    "More chaos coming.",
    "Follow for more.",
    "More simulations soon.",
]

[engagement.tease]
# Tease next video or bigger runs
texts = [
    "Next one is bigger.",
    "Just the beginning.",
]

[engagement.closing]
# Atmospheric closers - reflect on what just happened
# These work universally after any hook type
texts = [
    "Never the same twice.",
    "Every run diverges.",
    "Same laws. Different fates.",
    "Chaos never repeats.",
]
