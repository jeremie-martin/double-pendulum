# Video Post-Processing Templates
#
# Philosophy:
# - Less is more: 1-2 captions max, the visual IS the payoff
# - No text near the boom - that's the visual climax
# - Hooks should be self-contained or form coherent narratives
# - Let the chaos speak for itself
#
# Weight: higher = more likely when picking randomly (default 1)
# Zoom variation: end value is randomized ± variation each run
#
# PAIRING RULES:
# - _then templates: first pool MUST be a _setup pool (state descriptions)
# - mystery_followup: ONLY pair with _setup pools as first caption
# - Imperative pools (wait, challenge) are standalone or hook+end only

# =============================================================================
# SINGLE-CAPTION TEMPLATES
# =============================================================================

[template.minimal_science]
description = "Simple facts, visual payoff"
weight = 2

[template.minimal_science.motion]
slow_zoom = { start = 1.0, end = 1.1, variation = 0.02 }

[[template.minimal_science.captions]]
pool = "hooks.science"
position = "hook"
start = 0
end = 6.0
effects = { fade_in = 200, fade_out = 300 }


